[package]
name = "ergots-mainnet-validate-shim"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust shim subprocess for the ergots mainnet validation harness (T2 of 15 scaffolding; T3-T5 add GET_TIP_HEIGHT / GET_BLOCK)."

# This crate is intentionally NOT a member of any workspace. It lives outside
# both the ergots npm/cargo trees and the ergo-node-rust cargo workspace. The
# `enr-store` path-dep below reaches into ergo-node-rust's workspace but does
# not join it.

[dependencies]
# Modifier store from the user's local ergo-node-rust checkout. T2 needed
# `enr-store` for `tip(101)`/`tip(102)`/`best_header_at`/`read_header_at`.
# T5 keeps it for the same set of methods. We do NOT depend on `enr-chain`
# even though it has parsers we'd otherwise reuse — that crate references
# sigma-rust via a git rev (`3aa0832f`), and pulling it in would create
# the dependency-source mismatch the T2 hand-off warned about. Instead we
# re-derive the modifier-id construction (`blake2b256(type_id || ...)`)
# locally in `block_walker.rs` — three lines, source-mapped to
# `ergo-node-rust/chain/src/section.rs:60-66`.
enr-store = { path = "../../../../ergo-node-rust/store" }

# Sigma-rust crates added at T5 for transaction / extension parsing.
# Path-deps point at our local `external/sigma-rust/` checkout (HEAD
# `6ba9d524`, content-equivalent to the `3aa0832f` rev that `enr-chain`
# pins — both carry the nipopow fixes per user 2026-05-21). Because we
# do NOT depend on `enr-chain`, there's no second sigma-rust source in
# the graph for the resolver to disagree about, so a `[patch]` redirect
# isn't needed. `cargo tree | grep ergo-lib` after T5 confirms exactly
# one `ergo-lib` in the dependency graph.
#
# - `ergo-lib` — `Transaction::sigma_parse`, `Transaction::bytes_to_sign`,
#   `chain::parameters::Parameters` (max_block_cost lives here).
# - `ergotree-ir` — `SigmaSerializable` trait, `ErgoBox::sigma_serialize`,
#   `Constant::sigma_serialize` (ContextExtension value bytes).
# - `ergo-chain-types` — only via `ergo-lib` re-export; not direct here.
# - `sigma-ser` — `ReadSigmaVlqExt` for the BlockTransactions header read
#   (version sentinel + tx_count VLQ).
ergo-lib = { path = "../../../external/sigma-rust/ergo-lib" }
ergotree-ir = { path = "../../../external/sigma-rust/ergotree-ir" }
sigma-ser = { path = "../../../external/sigma-rust/sigma-ser" }

# blake2 for the modifier-id derivation. Pulling it as a direct dep here
# rather than via ergo-chain-types' `blake2b256_hash` re-export keeps the
# shim's dependency-on-sigma-rust to just the sigma_parse / sigma_serialize
# surface (the modifier-id construction is consensus-stable, not subject
# to sigma-rust API churn). `ergo-chain-types` itself pulls blake2 0.10,
# so the resolver unifies these.
blake2 = "0.10"

# redb version pinned to match ergo-node-rust's pin
# (ergo-node-rust/Cargo.toml:50 + ergo-node-rust/store/Cargo.toml:9 — both "4")
# to avoid duplicate-version conflicts via the enr-store path-dep.
redb = "4"

# CBOR framing on the wire (per spec Decision 8). 0.2.2 is what sigma-rust
# pulls transitively; pin to "0.2" for caret-compatibility with that.
ciborium = "0.2"

serde = { version = "1", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
# Cost-oracle unit tests (phase 2j-a/T3) construct synthetic PreHeader /
# Header / Transaction / ErgoBox fixtures via sigma-rust's proptest-arbitrary
# helpers. Enabling `arbitrary` on the relevant crates as dev-deps (not
# production deps) keeps the shim binary lean — proptest impls only
# compile in for `cargo test`.
proptest = "1"
sigma-test-util = { path = "../../../external/sigma-rust/sigma-test-util" }
ergo-chain-types = { path = "../../../external/sigma-rust/ergo-chain-types", features = ["arbitrary"] }
ergotree-ir = { path = "../../../external/sigma-rust/ergotree-ir", features = ["arbitrary"] }
ergo-lib = { path = "../../../external/sigma-rust/ergo-lib", features = ["arbitrary"] }

# Isolated tempdirs for sidecar unit tests. Matches enr-store's dev-dep
# pin so the resolver doesn't pull a duplicate version.
tempfile = "3"

# Patch crates.io's `ergo_avltree_rust = "0.1.1"` (which sigma-rust's
# `ergotree-interpreter` depends on as a published crate) over to a local
# fork at ~/projects/ergo_avltree_rust/ (HEAD 879545c). The fork applies
# upstream PRs #10/#11/#13 plus a Resolver API change
# (fn pointer → Arc<dyn Fn>) that sigma-rust's interpreter relies on at
# HEAD 6ba9d524. Without this patch, `cargo check` fails with E0308 in
# ergotree-interpreter on the Resolver type. Mirrors fixture-gen's
# `[patch.crates-io]` block (Cargo.toml lines noted in 2026-05-12 memory
# `project_fixture_gen_cargo_gotchas`).
[patch.crates-io]
ergo_avltree_rust = { path = "../../../../ergo_avltree_rust" }
