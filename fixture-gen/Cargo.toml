[package]
name = "fixture-gen"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
# Local-fork path deps. The fork lives at ~/projects/sigma-rust/sigma-rust/,
# checked out on branch `integration/ergots` (HEAD ed5452cf as of 2026-05-13),
# which is `ergo-node-integration` (cost-parity fixes) merged with upstream
# PR #862 head (`ergoscript-compiler-v2`, language conformance + Significant-15
# corpus + core2→core3 migration). These entries point to that fork's workspace
# member crates, so byte-for-byte fixtures generated here are equivalent to what
# ergo-node-rust would produce. If the local fork's branch or HEAD changes,
# regenerate fixtures and re-verify equivalence against a known-good
# ergo-node-rust build.
ergo-chain-types = { path = "../../sigma-rust/sigma-rust/ergo-chain-types" }
ergo-merkle-tree = { path = "../../sigma-rust/sigma-rust/ergo-merkle-tree" }
ergo-nipopow = { path = "../../sigma-rust/sigma-rust/ergo-nipopow" }
sigma-ser = { path = "../../sigma-rust/sigma-rust/sigma-ser" }
sigma-util = { path = "../../sigma-rust/sigma-rust/sigma-util" }
# The sigma-rust workspace declares ergotree-ir with default-features = false
# (it's a no_std-capable crate). ergo-nipopow uses ergotree-ir via workspace
# inheritance. When we reference sigma-rust crates as path deps from outside
# the workspace, resolver v2 inherits that default-features = false, so std
# doesn't activate automatically. Force it here so ergotree-ir compiles cleanly.
ergotree-ir = { path = "../../sigma-rust/sigma-rust/ergotree-ir", features = ["std", "json"] }
# Phase 2b eval fixtures use the interpreter as the oracle for (value, cost)
# capture. Same default-features-off concern as ergotree-ir — force std + json.
# The 'arbitrary' feature unlocks `eval::test_util::try_eval_out`, which is
# how fixture-gen evaluates expressions (Evaluable::eval is pub(crate)).
ergotree-interpreter = { path = "../../sigma-rust/sigma-rust/ergotree-interpreter", features = ["std", "json", "arbitrary"] }
# `try_eval_out` in test_util uses sigma_test_util::force_any_val to mint a
# synthetic Context. We need this crate as a direct dep so PLAN.md Tasks 9-15
# can `use sigma_test_util::force_any_val;`.
sigma-test-util = { path = "../../sigma-rust/sigma-rust/sigma-test-util" }
# Task 29 corpora compile ErgoScript sources via the upstream compiler so we
# get the same ErgoTree bytes the Scala node produces.
ergoscript-compiler = { path = "../../sigma-rust/sigma-rust/ergoscript-compiler" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
num-bigint = "0.4"
num-traits = "0.2"
# Layer C2 (Task 16) needs a *deterministic* synthetic Context across
# fixture-gen runs so JSON diffs stay clean. `sigma_test_util::force_any_val`
# uses `TestRunner::default()` which seeds from the OS RNG; we substitute
# `TestRunner::deterministic()` (fixed seed) for the mainnet_boxes corpus.
# Pinned to the version sigma-rust transitively pulls in.
proptest = "1.6"
# Phase 2g-medium Task 6 verifier fixtures construct deterministic
# DlogProverInput / DhTupleProverInput secrets directly from 32-byte seeds.
# Pinned to the same version the sigma-rust workspace uses (Cargo.toml:41).
k256 = { version = "0.13.1", default-features = false, features = ["arithmetic", "ecdsa"] }
# Phase 2g-combinators Task 2 fixtures cross-validate the TS port of GF(2^192)
# element arithmetic against sigma-rust's `gf2_192` crate (the same crate the
# Cthreshold conjecture verifier uses for polynomial interpolation).
gf2_192 = { path = "../../sigma-rust/sigma-rust/gf2_192" }
# Task B1 wider_corpus command: node REST fetch + deterministic PRNG + tx
# deserialization for the 700k cost-parity range import.
ergo-lib = { path = "../../sigma-rust/sigma-rust/ergo-lib", features = ["std", "json"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
rand = "0.8"
chrono = "0.4"
