name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-flight runs of the same workflow for the same ref. Keeps the queue clean
# during back-to-back commits without dropping the final state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript — typecheck + tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Project intentionally gitignores package-lock.json (library convention
      # per .gitignore comment), so `npm ci` + `cache: npm` (which both require
      # the lock file) are not viable. `npm install` regenerates the lock on
      # the fly; CI is slightly slower without the lockfile cache but stays
      # honest to the library publishing convention.
      - name: Install dependencies
        run: npm install

      # Build before typecheck: cross-workspace imports resolve via the
      # `types` field in each `packages/*/package.json` (e.g.
      # `@ergots/scorex` → `./dist/index.d.ts`), so the dist must exist for
      # tsc to find them. npm workspaces builds in dependency order, so
      # `@ergots/scorex` (no @ergots/* deps) is built first, then nipopow,
      # avltree, ergoscript.
      - name: Build all workspaces
        run: npm run build

      - name: Typecheck all workspaces
        run: |
          npx tsc --noEmit -p packages/scorex/tsconfig.json
          npx tsc --noEmit -p packages/nipopow/tsconfig.json
          npx tsc --noEmit -p packages/avltree/tsconfig.json
          npx tsc --noEmit -p packages/ergoscript/tsconfig.json

      - name: Run tests
        run: npm test

  pack-dry-run:
    name: npm pack — release-readiness sanity
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Build all workspaces
        run: npm run build

      - name: npm pack dry-run (each publishable workspace)
        run: |
          npm pack --dry-run --workspace @ergots/nipopow
          npm pack --dry-run --workspace @ergots/avltree
          npm pack --dry-run --workspace @ergots/ergoscript

  audit:
    name: npm audit — advisories report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      # Reports advisories; doesn't fail the build (audit OPS-02 follow-up will
      # gate this once the vitest upgrade lands and the moderate-severity
      # advisories clear).
      - name: npm audit (informational)
        run: npm audit --omit=optional --json || true
        continue-on-error: true
